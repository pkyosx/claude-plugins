<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f7f5;--surface:#ffffff;--fg:#1c2421;--muted:#5b6762;--line:#d9dfdb;--line-strong:#9aa5a0;
  --lane-a:#ffffff;--lane-b:#eef2f0;
  --node:#ffffff;--node-stroke:#b9c3be;--edge:#5e6a65;
  --gap:#1f6f5c;--gap-soft:#e3f1ec;--gap-ink:#ffffff;
  --ok:#2e7a3c;--ok-soft:#e5f2e6;
  --fail:#a2412f;--fail-soft:#f8e9e5;
  --risk:#b3261e;--risk-soft:#fdf0ee;
  --chip:#eef2f0;--focus:#1f6f5c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121715;--surface:#1a211e;--fg:#e4ebe7;--muted:#9aa8a1;--line:#2c3632;--line-strong:#55625c;
  --lane-a:#161c19;--lane-b:#1c2420;
  --node:#1f2723;--node-stroke:#4a5752;--edge:#9aa8a1;
  --gap:#5cc2a6;--gap-soft:#173129;--gap-ink:#0d1a15;
  --ok:#73c784;--ok-soft:#1a2e1e;
  --fail:#e48a76;--fail-soft:#35201b;
  --risk:#ff8a7a;--risk-soft:#2f1916;
  --chip:#232c28;--focus:#5cc2a6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715;--surface:#1a211e;--fg:#e4ebe7;--muted:#9aa8a1;--line:#2c3632;--line-strong:#55625c;
  --lane-a:#161c19;--lane-b:#1c2420;
  --node:#1f2723;--node-stroke:#4a5752;--edge:#9aa8a1;
  --gap:#5cc2a6;--gap-soft:#173129;--gap-ink:#0d1a15;
  --ok:#73c784;--ok-soft:#1a2e1e;
  --fail:#e48a76;--fail-soft:#35201b;
  --risk:#ff8a7a;--risk-soft:#2f1916;
  --chip:#232c28;--focus:#5cc2a6;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;font-size:15px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 48px;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto}
.wide{max-width:2400px;margin:0 auto}
h1{font-size:26px;margin:0 0 6px;letter-spacing:.01em;text-wrap:balance}
h2{font-size:19px;margin:36px 0 6px;text-wrap:balance}
p{margin:6px 0}
.lede{color:var(--muted);max-width:820px}
.tickets{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.tickets li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tickets a{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;white-space:nowrap}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.92em}
a{color:var(--gap)}
.meta{margin:16px 0 8px;font-size:13.5px;min-width:0}
.meta table{border-collapse:collapse}
.meta th,.meta td{padding:3px 10px 3px 0;text-align:left;white-space:nowrap}
.meta th{color:var(--muted);font-weight:500}
.tbl-scroll{overflow-x:auto;max-width:100%}
.note{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--muted);margin-top:10px}
.note b{color:var(--fg)}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:22px 0 10px}
.btn-plain{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted);align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:26px;height:16px;border-radius:4px;border:1.5px solid var(--node-stroke);background:var(--node)}
.sw.fail{border-color:var(--fail);background:var(--fail-soft)}
.sw.risk{border:1.6px dashed var(--risk);background:var(--risk-soft)}
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:var(--gap);color:var(--gap-ink);font-size:12px;font-weight:700;padding:0 5px;font-family:"IBM Plex Mono",monospace}
.rbdg{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:4px;background:var(--risk);color:var(--surface);font-size:12px;font-weight:700;padding:0 5px;font-family:"IBM Plex Mono",monospace}
.rbdg.ext{background:var(--muted)}
.diagram{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:10px;background:var(--lane-a);-webkit-overflow-scrolling:touch}
.diagram svg{display:block;width:100%;height:auto}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.lane-a{fill:var(--lane-a)}.lane-b{fill:var(--lane-b)}
.lane-sep{stroke:var(--line);stroke-width:1}
.lane-name{font-size:16px;font-weight:700;fill:var(--fg)}
.lane-sub{font-size:12.5px;fill:var(--muted)}
.n{cursor:pointer}
.n rect.box{fill:var(--node);stroke:var(--node-stroke);stroke-width:1.4}
.n .t{font-size:14.5px;font-weight:700;fill:var(--fg)}
.n .s{font-size:12px;fill:var(--muted)}
.n.fail rect.box{stroke:var(--fail);stroke-width:1.6;fill:var(--fail-soft)}
.n.risknode rect.box{stroke:var(--risk);stroke-dasharray:6 4;stroke-width:1.6;fill:var(--risk-soft)}
.n.risknode .t{fill:var(--risk)}
.n .gb circle{fill:var(--gap)}
.n .gb text{fill:var(--gap-ink);font-size:12px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.n .rb rect{fill:var(--risk)}
.n .rb.ext rect{fill:var(--muted)}
.n .rb text{fill:var(--surface);font-size:11.5px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.n.sel rect.box{stroke:var(--focus);stroke-width:3.4}
.n:focus{outline:none}
.n:focus-visible rect.box{stroke:var(--focus);stroke-width:3.4}
.e path{fill:none;stroke:var(--edge);stroke-width:1.5}
.e.rlink path{stroke:var(--risk);stroke-dasharray:2 4;stroke-width:1.4}
.e text{font-size:12px;fill:var(--muted);paint-order:stroke;stroke:var(--lane-a);stroke-width:4px;stroke-linejoin:round}
.e.on-b text{stroke:var(--lane-b)}
.dim{opacity:.18}
.n,.e{transition:opacity .15s}
.arrow{fill:var(--edge)}
.status{font-size:13.5px;color:var(--muted);margin-top:8px;min-height:1.6em}
dialog.nd{padding:0;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--fg);
  width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:hidden;box-shadow:0 18px 48px rgb(0 0 0 / .28)}
dialog.nd::backdrop{background:rgb(10 16 14 / .5)}
.nd .in{display:flex;flex-direction:column;max-height:calc(100dvh - 34px)}
.nd header{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.nd header h3{margin:0;font-size:16.5px;flex:1;min-width:0;text-wrap:balance}
.nd .x{background:none;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;flex:none;font:inherit;font-size:16px;line-height:1;color:var(--muted);cursor:pointer}
.nd .x:hover,.nd .x:focus-visible{color:var(--fg);border-color:var(--line-strong)}
.nd .body{padding:12px 16px 16px;overflow-y:auto;font-size:14.5px;overscroll-behavior:contain}
.nd .chips{margin-top:10px;display:grid;gap:6px}
.nd .chips span{display:inline-flex;gap:6px;align-items:center}
.nd .acs{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.nd h4{margin:0 0 6px;font-size:13.5px;color:var(--muted);font-weight:500}
.nd .acs ul{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.nd .acs li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gap);border-radius:8px;padding:12px 14px;cursor:pointer;font-size:14px;min-width:0}
.card.risk{border-left:4px dashed var(--risk)}
.card.risk.ext{border-left:4px dotted var(--line-strong)}
.card.sel{outline:2.5px solid var(--focus);outline-offset:1px}
.card h3{margin:0 0 6px;font-size:15.5px;display:flex;gap:8px;align-items:center}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.card dt{color:var(--muted);font-size:13px;white-space:nowrap;padding-top:1px}
.card dd{margin:0;min-width:0}
.tag{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:9px;border:1px solid var(--line-strong);color:var(--muted);margin-left:4px;vertical-align:1px;white-space:nowrap}
.tag.inf{border:1.4px dashed var(--risk);color:var(--risk)}
.tag.ok{border-color:var(--gap);color:var(--gap)}
.ac{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:4px;white-space:nowrap;color:var(--fg)}
.pr{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--chip);border-radius:4px;padding:1px 6px;margin-right:4px;white-space:nowrap}
details{margin-top:8px;font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted)}
details code{font-family:"IBM Plex Mono",monospace;font-size:12px;word-break:break-all;color:var(--fg)}
.foot{margin-top:36px;font-size:13px;color:var(--muted)}
.foot li{margin:3px 0}
@media (max-width:640px){h1{font-size:21px}.card dl{grid-template-columns:1fr}.card dt{padding-top:6px}}
</style>

<div class="wrap">
  <h1 id="title"></h1>
  <p class="lede" id="summary"></p>
  <ul class="tickets" id="tickets" hidden></ul>
  <div class="meta"><div class="tbl-scroll"><table id="prTable"></table></div></div>
  <div class="note" id="note"></div>
</div>

<div class="wide">
  <div class="controls">
    <button type="button" class="btn-plain" id="clearSel">清除選取</button>
    <div class="legend">
      <span class="k"><span class="bdg">1</span> PR 補上的缺口（本票新增或修改的步驟）</span>
      <span class="k" id="legendRisk"><span class="rbdg">A</span> 仍未補上的風險</span>
      <span class="k" id="legendExt"><span class="rbdg ext">E</span> 範圍外的既有問題</span>
      <span class="k" id="legendFail"><span class="sw fail"></span> 停止、失敗或不發事件</span>
      <span class="k" id="legendRiskNode"><span class="sw risk"></span> 風險情境（可能發生，不是既有步驟）</span>
      <span class="k">沒有綠色編號的節點＝改動前就有、本票沒改</span>
      <span class="k" id="legendRlink"><svg width="34" height="10" aria-hidden="true"><path d="M1 5 H33" stroke="var(--risk)" stroke-width="1.4" stroke-dasharray="2 4"/></svg> 風險關聯</span>
    </div>
  </div>
  <div class="diagram" id="diagram"></div>
  <p class="hint">點任一節點，會跳出說明、相關的 AC 與對應的缺口和風險；點缺口或風險卡片，圖上對應節點會被標出。手機上可左右滑動流程圖。</p>
  <p class="status" id="status" aria-live="polite"></p>
</div>

<dialog class="nd" id="nodeDlg" aria-labelledby="ndTitle">
  <div class="in">
    <header><h3 id="ndTitle"></h3><button type="button" class="x" id="ndClose" aria-label="關閉">✕</button></header>
    <div class="body" id="ndBody"></div>
  </div>
</dialog>

<div class="wrap">
  <h2>PR 補上的缺口</h2>
  <p class="lede" id="gapLede"></p>
  <div class="cards" id="gapCards"></div>

  <h2>仍未補上的缺口與剩餘風險</h2>
  <p class="lede" id="riskLede"></p>
  <div id="riskNote"></div>
  <div class="cards" id="riskCards"></div>

  <section id="extSection">
    <h2>範圍外的既有問題</h2>
    <p class="lede" id="extLede"></p>
    <div class="cards" id="extCards"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script>
(function(){
'use strict';
/* gen.py replaces the next line with the computed layout and card data. */
var D=/*__GAP_SWIMLANE_DATA__*/null;
var W=D.box.w,H=D.box.h;
var byId={};D.nodes.forEach(function(n){byId[n.id]=n;});
var acById={};D.acs.forEach(function(a){acById[a.ref]=a;});
var gapByN={};D.gaps.forEach(function(g){gapByN[g.n]=g;});
var ALLR=D.risks.concat(D.ext);
var riskByK={};ALLR.forEach(function(r){riskByK[r.key]=r;});
var EXTK=D.ext.map(function(r){return r.key;});
var prByKey={};D.prs.forEach(function(p){prByKey[p.key]=p;});
var sel=null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* Minimal inline markdown for spec text: **bold**, `code`, [text](url), [[確認]]-style tags. */
function md(s){
  var h=esc(s);
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/)[^)\s]+)\)/g,'<a href="$2">$1</a>');
  h=h.replace(/\[\[(推論|部分推論)\]\]/g,'<span class="tag inf">$1</span>');
  h=h.replace(/\[\[([^\]]+)\]\]/g,'<span class="tag ok">$1</span>');
  return h;
}
function infTag(v){return v===true?'<span class="tag inf">推論</span>':v==='part'?'<span class="tag inf">部分推論</span>':'';}
function pathD(p){return 'M'+p.map(function(q){return q[0]+' '+q[1];}).join(' L');}
function rbdg(k){return '<span class="rbdg'+(EXTK.indexOf(k)>=0?' ext':'')+'">'+esc(k)+'</span>';}
function acTag(ref){var a=acById[ref];return '<span class="ac" title="'+esc(a?a.text:'')+'">'+esc(ref)+'</span>';}

function header(){
  document.getElementById('title').textContent=D.title;
  document.getElementById('summary').innerHTML=md(D.summary);
  if(D.tickets.length){
    var tl=document.getElementById('tickets');
    tl.innerHTML=D.tickets.map(function(k){return '<li><a href="'+esc(k.url)+'">'+esc(k.key)+'</a><span>'+esc(k.title)+'</span></li>';}).join('');
    tl.hidden=false;
  }
  var hasT=D.prs.some(function(p){return p.ticket;}),hasS=D.prs.some(function(p){return p.state;});
  var t='<tr><th>PR（'+esc(D.pr_status)+'）</th>'+(hasT?'<th>票</th>':'')+(hasS?'<th>狀態</th>':'')+'<th>改動前 merge base</th><th>改動後 PR head</th></tr>';
  D.prs.forEach(function(p){t+='<tr><td><a href="'+esc(p.url)+'">'+esc(p.name)+'</a></td>'+(hasT?'<td class="mono">'+esc(p.ticket)+'</td>':'')+(hasS?'<td>'+esc(p.state)+'</td>':'')+'<td class="mono">'+esc(p.base)+'</td><td class="mono">'+esc(p.head)+'</td></tr>';});
  document.getElementById('prTable').innerHTML=t;
  document.getElementById('note').innerHTML=md(D.note);
  document.getElementById('gapLede').innerHTML=md(D.ledes.gaps);
  document.getElementById('riskLede').innerHTML=md(D.ledes.risks);
  document.getElementById('extLede').innerHTML=md(D.ledes.ext);
  if(D.risk_note)document.getElementById('riskNote').innerHTML='<div class="note">'+md(D.risk_note)+'</div>';
  if(!D.ext.length){document.getElementById('extSection').hidden=true;document.getElementById('legendExt').hidden=true;}
  var has=function(k){return D.nodes.some(function(n){return n.kind===k;});};
  document.getElementById('legendRisk').hidden=!D.risks.length;
  document.getElementById('legendFail').hidden=!has('fail');
  document.getElementById('legendRiskNode').hidden=!has('risknode');
  document.getElementById('legendRlink').hidden=!D.edges.some(function(e){return e.risk;});
  if(D.limits.length)document.getElementById('foot').innerHTML='<p><b>讀圖時的限制</b></p><ul>'+D.limits.map(function(l){return '<li>'+md(l)+'</li>';}).join('')+'</ul>';
}

function render(){
  var s=[];
  s.push('<svg viewBox="0 0 '+D.svg.w+' '+D.svg.h+'" style="min-width:'+Math.round(D.svg.w*0.8)+'px" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+esc(D.title)+'">');
  s.push('<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow"/></marker></defs>');
  D.lanes.forEach(function(L,i){
    s.push('<rect x="0" y="'+L.y+'" width="'+D.svg.w+'" height="'+L.h+'" class="'+(i%2?'lane-b':'lane-a')+'"/>');
    if(i>0)s.push('<line x1="0" x2="'+D.svg.w+'" y1="'+L.y+'" y2="'+L.y+'" class="lane-sep"/>');
    var ty=L.y+L.h/2-L.sub.length*9;
    s.push('<text x="22" y="'+ty+'" class="lane-name">'+esc(L.name)+'</text>');
    L.sub.forEach(function(t,j){s.push('<text x="22" y="'+(ty+22+j*18)+'" class="lane-sub">'+esc(t)+'</text>');});
  });
  s.push('<line x1="'+D.svg.label_w+'" x2="'+D.svg.label_w+'" y1="0" y2="'+D.svg.h+'" class="lane-sep"/>');
  D.edges.forEach(function(e,i){
    s.push('<g class="e'+(e.risk?' rlink':'')+(e.on_b?' on-b':'')+'" data-f="'+e.from+'" data-t="'+e.to+'" data-i="'+i+'">');
    s.push('<path d="'+pathD(e.pts)+'"'+(e.risk?'':' marker-end="url(#ah)"')+'/>');
    if(e.label)s.push('<text x="'+e.lp[0]+'" y="'+e.lp[1]+'" text-anchor="'+e.anchor+'">'+esc(e.label)+'</text>');
    s.push('</g>');
  });
  D.nodes.forEach(function(n){
    var cls=['n'];
    if(n.kind!=='normal')cls.push(n.kind);
    s.push('<g class="'+cls.join(' ')+'" data-id="'+n.id+'" tabindex="0" role="button" aria-label="'+esc(n.title+(n.sub?'，'+n.sub:''))+'">');
    s.push('<rect class="box" x="'+(n.x-W/2)+'" y="'+(n.y-H/2)+'" width="'+W+'" height="'+H+'" rx="8"/>');
    var ty=n.sub?n.y-4:n.y+5;
    s.push('<text class="t" x="'+n.x+'" y="'+ty+'" text-anchor="middle">'+esc(n.title)+'</text>');
    if(n.sub)s.push('<text class="s" x="'+n.x+'" y="'+(n.y+16)+'" text-anchor="middle">'+esc(n.sub)+'</text>');
    n.gaps.forEach(function(g,j){
      var gx=n.x-W/2+4+j*24,gy=n.y-H/2;
      s.push('<g class="gb"><circle cx="'+gx+'" cy="'+gy+'" r="10.5"/><text x="'+gx+'" y="'+(gy+4.2)+'" text-anchor="middle">'+g+'</text></g>');
    });
    n.risks.forEach(function(r,j){
      var rx=n.x+W/2-14-j*22,ry=n.y-H/2;
      s.push('<g class="rb'+(EXTK.indexOf(r)>=0?' ext':'')+'"><rect x="'+(rx-9)+'" y="'+(ry-9)+'" width="18" height="18" rx="3"/><text x="'+rx+'" y="'+(ry+4)+'" text-anchor="middle">'+esc(r)+'</text></g>');
    });
    s.push('</g>');
  });
  s.push('</svg>');
  document.getElementById('diagram').innerHTML=s.join('');
  Array.prototype.forEach.call(document.querySelectorAll('#diagram .n'),function(g){
    var act=function(){openNode(g.dataset.id);};
    g.addEventListener('click',act);
    g.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();act();}});
  });
}

function nodeNames(pred){return D.nodes.filter(pred).map(function(n){return esc(n.title);}).join('、')||'（未標在圖上）';}

function cards(){
  document.getElementById('gapCards').innerHTML=D.gaps.map(function(x){
    return '<div class="card" data-gap="'+x.n+'" tabindex="0" role="button">'+
      '<h3><span class="bdg">'+x.n+'</span>'+esc(x.title)+'</h3><dl>'+
      '<dt>改動前</dt><dd>'+md(x.before)+(x.before_basis?'<span class="tag ok">'+esc(x.before_basis)+'</span>':'')+
        (x.before_inference?'<br><span class="tag inf">推論</span> '+md(x.before_inference):'')+
        (x.before_note?'<br><span class="tag">備註</span> '+md(x.before_note):'')+'</dd>'+
      '<dt>PR 補了</dt><dd>'+md(x.after)+'</dd>'+
      (x.tickets.length?'<dt>服務的票</dt><dd>'+x.tickets.map(function(k){return '<span class="ac">'+esc(k)+'</span>';}).join('')+'</dd>':'')+
      '<dt>哪支 PR</dt><dd>'+x.prs.map(function(k){var p=prByKey[k];return '<a class="pr" href="'+esc(p.url)+'">'+esc(p.short||p.name)+'</a>';}).join('')+'</dd>'+
      (x.acs.length?'<dt>對應 AC</dt><dd>'+x.acs.map(acTag).join('')+'</dd>':'')+
      '<dt>圖上節點</dt><dd>'+nodeNames(function(n){return n.gaps.indexOf(x.n)>=0;})+'</dd>'+
      '</dl>'+(x.eng?'<details><summary>工程依據</summary><code>'+esc(x.eng)+'</code></details>':'')+'</div>';
  }).join('');
  var rf=function(x){
    var tag=infTag(x.inf)+(x.ext?'<span class="tag">範圍外的既有問題</span>':'');
    return '<div class="card risk'+(x.ext?' ext':'')+'" data-risk="'+esc(x.key)+'" tabindex="0" role="button">'+
      '<h3>'+rbdg(x.key)+esc(x.title)+'</h3><dl>'+
      '<dt>狀況</dt><dd>'+md(x.text)+'</dd>'+
      '<dt>依據</dt><dd>'+md(x.basis)+' '+tag+'</dd>'+
      '<dt>圖上節點</dt><dd>'+nodeNames(function(n){return n.risks.indexOf(x.key)>=0;})+'</dd>'+
      '</dl>'+(x.eng?'<details><summary>工程依據</summary><code>'+esc(x.eng)+'</code></details>':'')+'</div>';
  };
  document.getElementById('riskCards').innerHTML=D.risks.map(rf).join('');
  document.getElementById('extCards').innerHTML=D.ext.map(rf).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.card'),function(c){
    var act=function(){var k=c.dataset.gap?{type:'gap',v:+c.dataset.gap}:{type:'risk',v:c.dataset.risk};
      sel=(sel&&sel.type===k.type&&sel.v===k.v)?null:k;applyHighlight();
      if(sel)document.getElementById('diagram').scrollIntoView({behavior:'smooth',block:'nearest'});};
    c.addEventListener('click',function(ev){if(ev.target.closest('a,summary,details'))return;act();});
    c.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();act();}});
  });
}

function applyHighlight(){
  var hot=null;
  if(sel){
    if(sel.type==='gap')hot=D.nodes.filter(function(n){return n.gaps.indexOf(sel.v)>=0;}).map(function(n){return n.id;});
    else hot=D.nodes.filter(function(n){return n.risks.indexOf(sel.v)>=0;}).map(function(n){return n.id;});
  }
  Array.prototype.forEach.call(document.querySelectorAll('#diagram .n'),function(g){
    var id=g.dataset.id;
    g.classList.toggle('dim',hot!==null&&hot.indexOf(id)<0);
    g.classList.toggle('sel',!!(sel&&hot&&hot.indexOf(id)>=0));
  });
  Array.prototype.forEach.call(document.querySelectorAll('#diagram .e'),function(g){
    var f=g.dataset.f,t=g.dataset.t;
    var d=hot!==null&&!(hot.indexOf(f)>=0&&hot.indexOf(t)>=0);
    g.classList.toggle('dim',d);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.card'),function(c){
    var on=false;
    if(sel){
      if(sel.type==='gap')on=+c.dataset.gap===sel.v;
      else on=c.dataset.risk===sel.v;
    }
    c.classList.toggle('sel',on);
  });
  var st=document.getElementById('status');
  if(sel)st.innerHTML='已選取'+(sel.type==='gap'?'缺口 <span class="bdg">'+sel.v+'</span> ':'風險 '+rbdg(sel.v)+' ')+esc((sel.type==='gap'?gapByN[sel.v]:riskByK[sel.v]).title)+'，圖上已標出相關節點，其餘節點變淡。';
  else st.textContent='';
}

var dlg=document.getElementById('nodeDlg');
function openNode(id){
  var n=byId[id];
  document.getElementById('ndTitle').innerHTML=esc(n.title)+' '+infTag(n.inf);
  var chips=n.gaps.map(function(g){return '<span><span class="bdg">'+g+'</span> '+esc(gapByN[g].title)+'</span>';})
    .concat(n.risks.map(function(r){return '<span>'+rbdg(r)+' '+esc(riskByK[r].title)+'</span>';}));
  var acs=n.acs.length?'<div class="acs"><h4>相關 AC</h4><ul>'+n.acs.map(function(a){return '<li>'+acTag(a)+'<span>'+md(acById[a].text)+'</span></li>';}).join('')+'</ul></div>':'';
  document.getElementById('ndBody').innerHTML=(n.sub?'<p style="margin:0 0 6px;color:var(--muted)">'+esc(n.sub)+'</p>':'')+'<div>'+md(n.detail)+'</div>'+
    (chips.length?'<div class="chips">'+chips.join('')+'</div>':'')+acs+
    (n.eng?'<details><summary>工程依據</summary><code>'+esc(n.eng)+'</code></details>':'');
  document.getElementById('ndBody').scrollTop=0;
  if(typeof dlg.showModal==='function'){if(!dlg.open)dlg.showModal();}else dlg.setAttribute('open','');
}
document.getElementById('ndClose').addEventListener('click',function(){dlg.close();});
/* A click on the backdrop lands on the <dialog> itself; clicks inside land on .in or its children. */
dlg.addEventListener('click',function(ev){if(ev.target===dlg)dlg.close();});
document.getElementById('clearSel').addEventListener('click',function(){sel=null;applyHighlight();});
header();cards();render();applyHighlight();
})();
</script>
